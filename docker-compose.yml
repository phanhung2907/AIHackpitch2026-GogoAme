services:
  postgres_dev:
    image: postgres:16.6-alpine
    container_name: taporder-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_DEV_USER:-taporder}
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:-taporder_dev_local_only}
      POSTGRES_DB: ${POSTGRES_DEV_DB:-taporder_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - taporder_pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    image: postgres:16.6-alpine
    container_name: taporder-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-taporder_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-taporder_test_local_only}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-taporder_test}
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: taporder-backend-api
    depends_on:
      postgres_dev:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://taporder:taporder_dev_local_only@postgres_dev:5432/taporder_dev}
      SESSION_SECRET: ${SESSION_SECRET:-dev-placeholder-session-secret-minimum-32-chars}
      QR_ENCRYPTION_KEY: ${QR_ENCRYPTION_KEY:-k1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:5173}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost,backend}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_TIMEZONE: ${DEMO_TIMEZONE:-Asia/Bangkok}
      ENABLE_MOCKS: "false"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  taporder_pg_dev_data:

