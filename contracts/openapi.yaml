          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
        "422":
          $ref: "#/components/responses/Error422"
        "503":
          $ref: "#/components/responses/Error503"

  /api/v1/cashier/tables/{id}/qr:
    get:
      operationId: cashier_export_table_qr
      tags: [cashier]
      summary: Decrypt and export capability QR URL for a specific table
      security:
        - StaffCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
      responses:
        "200":
          description: Table capability QR URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TableQrExportResponse"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "503":
          $ref: "#/components/responses/Error503"

  /api/v1/guest/bills/{id}/events:
    get:
      operationId: guest_bill_events
      tags: [events]
      summary: Scoped SSE stream for a specific bill (requires guest membership)
      security:
        - GuestCookie: []
      parameters:
        - $ref: "#/components/parameters/ResourceIdPath"
        - $ref: "#/components/parameters/AfterCursorQuery"
        - $ref: "#/components/parameters/LastEventIdHeader"
      responses:
        "200":
          $ref: "#/components/responses/SseStream200"
        "401":
          $ref: "#/components/responses/Error401"
        "404":
          $ref: "#/components/responses/Error404"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"

  /api/v1/guest/menu/events:
    get:
      operationId: guest_menu_events
      tags: [events]
      summary: SSE stream for guest menu availability and shift changes
      security:
        - GuestCookie: []
      parameters:
        - $ref: "#/components/parameters/AfterCursorQuery"
        - $ref: "#/components/parameters/LastEventIdHeader"
      responses:
        "200":
          $ref: "#/components/responses/SseStream200"
        "401":
          $ref: "#/components/responses/Error401"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"

  /api/v1/kitchen/events:
    get:
      operationId: kitchen_events
      tags: [events]
      summary: SSE stream for barista kitchen queue, menu availability, and shift changes
      security:
        - StaffCookie: []
      parameters:
        - $ref: "#/components/parameters/AfterCursorQuery"
        - $ref: "#/components/parameters/LastEventIdHeader"
      responses:
        "200":
          $ref: "#/components/responses/SseStream200"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "422":
          $ref: "#/components/responses/Error422"
        "429":
          $ref: "#/components/responses/Error429"

  /api/v1/cashier/events:
    get:
      operationId: cashier_events
      tags: [events]
      summary: SSE stream for cashier tables, bills, payments, menu, and shift changes
      security:
        - StaffCookie: []
      parameters:
        - $ref: "#/components/parameters/AfterCursorQuery"
